name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Validate version consistency across manifest files
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>.+)$') {
            throw "Release tag '$tag' does not start with 'v'."
          }
          $expectedVersion = $Matches['version']

          # 1. PopGlot.Windows.csproj <Version>
          $csprojText = Get-Content 'apps/PopGlot.Windows/PopGlot.Windows.csproj' -Raw
          if ($csprojText -notmatch '<Version>\s*([^\s<]+)\s*</Version>') {
            throw "Could not parse <Version> from apps/PopGlot.Windows/PopGlot.Windows.csproj"
          }
          $csprojVersion = $Matches[1]
          if ($csprojVersion -ne $expectedVersion) {
            throw "Version mismatch: tag '$tag' specifies version '$expectedVersion', but PopGlot.Windows.csproj has '$csprojVersion'."
          }

          # 2. Cargo.toml workspace.package version
          $cargoText = Get-Content 'Cargo.toml' -Raw
          if ($cargoText -notmatch '(?ms)\[workspace\.package\].*?version\s*=\s*"([^"]+)"') {
            throw "Could not parse [workspace.package] version from Cargo.toml"
          }
          $cargoVersion = $Matches[1]
          if ($cargoVersion -ne $expectedVersion) {
            throw "Version mismatch: tag '$tag' specifies version '$expectedVersion', but Cargo.toml workspace version has '$cargoVersion'."
          }

          # 3. CHANGELOG.md top version
          $changelogText = Get-Content 'CHANGELOG.md' -Raw
          if ($changelogText -notmatch '(?m)^##\s+\[?v?([0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?)\]?') {
            throw "Could not parse top version header from CHANGELOG.md"
          }
          $changelogVersion = $Matches[1]
          if ($changelogVersion -ne $expectedVersion) {
            throw "Version mismatch: tag '$tag' specifies version '$expectedVersion', but CHANGELOG.md top version is '$changelogVersion'."
          }

          # 4. Cargo.lock workspace crate versions
          # The [workspace.package] version in Cargo.toml is not enough: Cargo.lock
          # pins its own version per crate, and a lock file left behind after a bump
          # fails every `cargo --locked` step below with an opaque error. The three
          # workspace crates must each match the release tag.
          $lockText = Get-Content 'Cargo.lock' -Raw
          $lockCrates = @('popglot-core', 'popglot-domain', 'popglot-ffi')
          $lockVersions = @{}
          foreach ($crate in $lockCrates) {
              $pattern = '(?m)^name = "' + $crate + '"\r?\nversion = "([^"]+)"'
              if ($lockText -notmatch $pattern) {
                  throw "Could not parse the version of crate '$crate' from Cargo.lock"
              }
              $crateVersion = $Matches[1]
              $lockVersions[$crate] = $crateVersion
              if ($crateVersion -ne $expectedVersion) {
                  throw "Version mismatch: tag '$tag' specifies version '$expectedVersion', but Cargo.lock pins crate '$crate' at '$crateVersion'. Run 'cargo update --workspace' and commit the lock file."
              }
          }
          $lockSummary = ($lockCrates | ForEach-Object { "$_=$($lockVersions[$_])" }) -join ', '

          Write-Host "All versions match release tag $tag ($expectedVersion): csproj=$csprojVersion, cargo=$cargoVersion, changelog=$changelogVersion, lock=[$lockSummary]"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      # Full gate before packaging: Rust tests/clippy must pass and both the
      # pure C# tests and the shell logic tests (privacy matrix, DPI
      # screenshots) run against the Release build.
      - run: cargo test --workspace --locked --release
      - run: cargo clippy --workspace --all-targets --locked --release -- -D warnings
      - run: cargo fmt --all -- --check
      - run: dotnet build apps/PopGlot.Windows/PopGlot.Windows.csproj --configuration Release
      - run: dotnet run --project tests/PopGlot.Windows.PureTests/PopGlot.Windows.PureTests.csproj --configuration Release
      - run: dotnet run --project tests/PopGlot.Windows.LogicTests/PopGlot.Windows.LogicTests.csproj --configuration Release
      - run: dotnet run --project tests/PopGlot.Windows.CliTests/PopGlot.Windows.CliTests.csproj --configuration Release -- --ui

      - name: Publish portable build
        run: >
          dotnet publish apps/PopGlot.Windows/PopGlot.Windows.csproj
          --configuration Release --runtime win-x64
          --self-contained true
          --output dist/release
          /p:DebugType=None /p:DebugPortablePdb=false
          /p:ContinuousIntegrationBuild=true

      # The csproj copies the Rust core into the build output only, so the
      # publish folder needs the native dll shipped explicitly.
      - name: Ship the Rust core with the app
        shell: pwsh
        run: |
          Copy-Item 'target\release\popglot_ffi.dll' 'dist\release\popglot_ffi.dll'
          if (-not (Test-Path 'dist\release\popglot_ffi.dll')) {
            throw 'popglot_ffi.dll is missing from the publish output.'
          }

      - name: Zip portable build
        shell: pwsh
        run: |
          $zipName = "PopGlot-$($env:GITHUB_REF_NAME)-win-x64.zip"
          $zipPath = "dist/$zipName"
          $shaPath = "dist/$zipName.sha256"
          Compress-Archive -Path 'dist/release/*' -DestinationPath $zipPath
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName`n" | Set-Content -Path $shaPath -NoNewline

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc -and -not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install Inno Setup (exit code $LASTEXITCODE)."
            }
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/build-installer.ps1 -Version $version

      - name: Write the release page
        id: release_page
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/write-release-notes.ps1 -Version $version -OutFile dist/release-notes.txt
          "title=PopGlot $version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: ${{ steps.release_page.outputs.title }}
          body_path: dist/release-notes.txt
          files: |
            dist/PopGlot-${{ github.ref_name }}-win-x64.zip
            dist/PopGlot-${{ github.ref_name }}-win-x64.zip.sha256
            dist/PopGlot-${{ github.ref_name }}-win-x64-setup.exe
            dist/PopGlot-${{ github.ref_name }}-win-x64-setup.exe.sha256
