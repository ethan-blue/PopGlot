[workspace]
members = [
    "crates/popglot-domain",
    "crates/popglot-core",
    "crates/popglot-ffi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["PopGlot Contributors"]
repository = "https://github.com/ethan-blue/PopGlot"

[workspace.dependencies]
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
