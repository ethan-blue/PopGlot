[workspace]
members = [
    "crates/popglot-domain",
    "crates/popglot-core",
    "crates/popglot-ffi",
]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "MIT"
authors = ["PopGlot Contributors"]
repository = "https://github.com/ethan-blue/PopGlot"

[workspace.dependencies]
base64 = "0.22"
futures-util = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
